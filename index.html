<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TURAN — Fitness Management</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --transition: 0.3s ease;
            --font: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --radius: 14px;
            --radius-sm: 10px;
            --sidebar-w: 240px;
        }
        [data-theme="dark"] {
            --bg: #0c0a09; --bg-elevated: #1c1917; --card: #1c1917; --border: #292524;
            --text: #fafaf9; --text-muted: #a8a29e; --primary: #f97316; --primary-hover: #ea580c;
            --primary-soft: rgba(249,115,22,0.15); --accent: #fb923c; --success: #22c55e;
            --danger: #ef4444; --warning: #eab308; --shadow: 0 8px 30px rgba(0,0,0,0.45);
            --input-bg: #0c0a09; --sidebar-bg: #141210;
        }
        [data-theme="light"] {
            --bg: #fff7ed; --bg-elevated: #fff; --card: #fff; --border: #fed7aa;
            --text: #1c1917; --text-muted: #78716c; --primary: #ea580c; --primary-hover: #c2410c;
            --primary-soft: rgba(234,88,12,0.12); --accent: #f97316; --success: #16a34a;
            --danger: #dc2626; --warning: #ca8a04; --shadow: 0 8px 30px rgba(234,88,12,0.08);
            --input-bg: #fff7ed; --sidebar-bg: #ffedd5;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
        body { background: var(--bg); color: var(--text); min-height: 100vh; transition: background var(--transition), color var(--transition); }

        #auth-screen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .auth-card { width: 100%; max-width: 400px; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; box-shadow: var(--shadow); text-align: center; }
        .auth-card h2 { font-size: 1.5rem; margin-bottom: 8px; }
        .auth-card p { color: var(--text-muted); margin-bottom: 24px; font-size: 0.95rem; }
        .divider { margin: 20px 0; border-top: 1px solid var(--border); position: relative; }
        .divider span { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); background: var(--card); padding: 0 12px; color: var(--text-muted); font-size: 0.75rem; font-weight: 600; }
        .demo-btns { display: flex; flex-direction: column; gap: 10px; }

        #app-shell { display: none; min-height: 100vh; }
        .topbar { height: 56px; background: var(--card); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; position: sticky; top: 0; z-index: 50; }
        .logo { font-size: 1.2rem; font-weight: 800; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .logo-mark { width: 30px; height: 30px; background: linear-gradient(135deg, var(--primary), var(--accent)); border-radius: 8px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 0.9rem; }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .role-badge { background: var(--primary); color: #fff; padding: 3px 10px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; }
        .theme-btn { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
        .theme-btn:hover { border-color: var(--primary); color: var(--primary); }

        .layout { display: flex; min-height: calc(100vh - 56px); }
        .sidebar { width: var(--sidebar-w); background: var(--sidebar-bg); border-right: 1px solid var(--border); padding: 20px 12px; flex-shrink: 0; position: sticky; top: 56px; height: calc(100vh - 56px); overflow-y: auto; }
        .sidebar-section { margin-bottom: 20px; }
        .sidebar-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); padding: 0 12px; margin-bottom: 8px; }
        .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: var(--radius-sm); color: var(--text-muted); cursor: pointer; font-size: 0.9rem; font-weight: 500; transition: all var(--transition); border: none; background: none; width: 100%; text-align: left; }
        .nav-item:hover { background: var(--primary-soft); color: var(--primary); }
        .nav-item.active { background: var(--primary); color: #fff; }
        .nav-item .nav-icon { width: 20px; text-align: center; font-size: 1rem; }

        .content { flex: 1; padding: 24px; overflow-x: hidden; max-width: 1100px; }
        .page { display: none; }
        .page.active { display: block; }
        .page-title { font-size: 1.4rem; font-weight: 800; margin-bottom: 6px; }
        .page-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 22px; }

        .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); margin-bottom: 20px; }
        .card-title { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 20px; }
        .grid-2 { grid-template-columns: repeat(2, 1fr); }
        @media (max-width: 800px) { .grid-2 { grid-template-columns: 1fr; } .sidebar { width: 200px; } }

        .btn { padding: 10px 16px; border: none; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 0.9rem; transition: all var(--transition); }
        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-danger { background: var(--danger); color: #fff; }
        .btn-warning { background: var(--warning); color: #1c1917; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-soft); }
        .btn-sm { padding: 6px 12px; font-size: 0.8rem; }
        .btn-block { width: 100%; }

        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; font-weight: 500; }
        .form-control { width: 100%; padding: 10px 12px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: var(--radius-sm); outline: none; font-size: 0.95rem; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }

        .table-wrap { overflow-x: auto; border-radius: var(--radius-sm); }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th, td { padding: 11px 12px; border-bottom: 1px solid var(--border); text-align: left; }
        th { background: var(--bg); color: var(--text-muted); font-weight: 600; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.03em; }
        tr:hover td { background: var(--primary-soft); }

        .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 18px; }
        .stat-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; }
        .stat-value { font-size: 1.55rem; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

        .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
        .search-box { flex: 1; min-width: 160px; position: relative; }
        .search-box input { padding-left: 34px; }
        .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.9rem; pointer-events: none; }
        .pagination { display: flex; gap: 5px; align-items: center; justify-content: flex-end; margin-top: 12px; flex-wrap: wrap; }
        .page-btn { min-width: 34px; height: 34px; padding: 0 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); cursor: pointer; font-weight: 600; font-size: 0.85rem; }
        .page-btn:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
        .page-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .page-info { font-size: 0.85rem; color: var(--text-muted); margin-right: 6px; }

        .tag { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
        .tag-ok { background: rgba(34,197,94,0.15); color: var(--success); }
        .tag-warn { background: rgba(234,179,8,0.15); color: var(--warning); }
        .tag-danger { background: rgba(239,68,68,0.15); color: var(--danger); }

        .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .product-card { background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; text-align: center; transition: all var(--transition); }
        .product-card:hover { border-color: var(--primary); transform: translateY(-2px); }
        .product-title { font-weight: 700; margin-bottom: 4px; font-size: 0.9rem; }
        .product-price { color: var(--primary); font-size: 1.1rem; font-weight: 800; }
        .product-stock { font-size: 0.75rem; color: var(--text-muted); margin-top: 3px; }

        .member-hero { background: linear-gradient(135deg, var(--primary), #fb923c); color: #fff; border: none; }
        .member-hero .card-title { color: #fff; }
        .member-hero .days { font-size: 2.4rem; font-weight: 800; }
        .member-hero .meta { font-size: 0.85rem; opacity: 0.9; }

        .chart-box { position: relative; height: 240px; }
        .report-filters { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 14px; align-items: flex-end; }
        .report-filters .form-group { margin-bottom: 0; min-width: 130px; }

        .loyalty-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
        @media (max-width: 600px) { .loyalty-grid { grid-template-columns: repeat(3, 1fr); } }
        .loyalty-card {
            aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--border);
            display: flex; align-items: center; justify-content: center;
            font-weight: 800; font-size: 1.1rem; background: var(--bg); color: var(--text-muted);
            transition: all 0.4s ease;
        }
        .loyalty-card.filled {
            background: linear-gradient(135deg, var(--primary), var(--accent));
            border-color: var(--primary); color: #fff;
            box-shadow: 0 4px 16px rgba(249,115,22,0.35); transform: scale(1.02);
        }
        .loyalty-progress { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 14px; }

        .qr-box { display: flex; flex-direction: column; align-items: center; gap: 12px; }
        #qr-canvas { background: #fff; padding: 12px; border-radius: 12px; }
        .qr-code-label { font-family: monospace; font-size: 0.85rem; color: var(--text-muted); word-break: break-all; text-align: center; }

        .menu-toggle { display: none; background: none; border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; }
        @media (max-width: 720px) {
            .sidebar { position: fixed; left: -260px; top: 56px; z-index: 40; height: calc(100vh - 56px); transition: left 0.25s ease; box-shadow: var(--shadow); }
            .sidebar.open { left: 0; }
            .menu-toggle { display: block; }
            .content { padding: 16px; }
        }

        @media print {
            .topbar, .sidebar, .toolbar, .pagination, .report-filters, .btn, .no-print, .menu-toggle { display: none !important; }
            .content { max-width: 100%; padding: 0; }
            body { background: white !important; color: black !important; }
            .card { border: none !important; box-shadow: none !important; }
            .print-header { display: block !important; text-align: center; margin-bottom: 24px; border-bottom: 2px solid #f97316; padding-bottom: 16px; }
            .print-header h1 { font-size: 1.6rem; color: #ea580c; margin-bottom: 4px; }
            .print-header .slogan { font-size: 1rem; color: #78716c; font-style: italic; }
            .print-header .client-line { font-size: 1.15rem; font-weight: 700; margin-top: 10px; color: #1c1917; }
        }
        .trainer-photo { width:100%; height:180px; object-fit:cover; border-radius:12px; background:var(--bg); }
        textarea.form-control { resize:vertical; }
        select[multiple].form-control { min-height:160px; }
        .assignment-card { border-left:4px solid var(--primary); }
        @media (max-width:720px){ .grid.grid-2{grid-template-columns:1fr;} }
        .print-header { display: none; }
    </style>
</head>
<body>

<div id="auth-screen">
    <div class="auth-card">
        <div class="logo" style="justify-content:center; margin-bottom:16px;">
            <span class="logo-mark">T</span> TURAN
        </div>
        <h2>Вход в систему</h2>
        <p>Единый вход через Google. Роль и доступы определяются в Firebase.</p>
        <button class="btn btn-primary btn-block" onclick="loginWithGoogle()">Войти через Google</button>
        <div id="auth-status" style="margin-top:14px;color:var(--text-muted);font-size:.82rem;"></div>
    </div>
</div>

<div id="app-shell">
    <div class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
            <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
            <div class="logo"><span class="logo-mark">T</span> TURAN</div>
        </div>
        <div class="topbar-right">
            <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">Тёмная</button>
            <span id="user-name-display" style="font-weight:600; font-size:0.9rem;"></span>
            <span id="user-role-display" class="role-badge"></span>
            <button class="btn btn-outline btn-sm" onclick="logout()">Выход</button>
        </div>
    </div>
    <div class="layout">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="content" id="main-content"></main>
    </div>
</div>

<div class="print-header" id="print-header">
    <h1>TURAN</h1>
    <div class="slogan" id="print-slogan">Сила начинается с первого шага. Желаем продуктивной тренировки!</div>
    <div class="client-line" id="print-client"></div>
</div>

<script>
/* ============================================================
   FIREBASE — вставьте свои ключи из Firebase Console
   ============================================================ */
const firebaseConfig = window.TURAN_FIREBASE_CONFIG || {
   apiKey: "AIzaSyBArSUIbrJa5Ht8sAVLPSEqf0kOEwMvFu8",
  authDomain: "gym-6ff42.firebaseapp.com",
  projectId: "gym-6ff42",
  storageBucket: "gym-6ff42.firebasestorage.app",
  messagingSenderId: "1096456155330",
  appId: "1:1096456155330:web:5bc5507a80c6c2e26a0b5b"
};
const TURAN_CONFIG = window.TURAN_CONFIG || {
    adminEmails: [],
    gymName: "TURAN"
};

let db = null;
let auth = null;
let useFirestore = false;

try {
    if (firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY") {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
        // Firebase сохраняет авторизацию между обновлениями страницы.
        // Выход происходит только через кнопку «Выход».
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(e => console.warn('Auth persistence', e));
        useFirestore = true;
    }
} catch (e) {
    console.warn("Firebase not configured, using localStorage", e);
}

const STORE_KEYS = {
    inventory: 'gym_store',
    clients: 'gym_members',
    activity: 'gym_activity',
    metrics: 'gym_member_metrics',
    loyalty: 'gym_loyalty',
    profiles: 'gym_client_profiles',
    trainers: 'turan_trainers',
    trainerCategories: 'turan_trainer_categories',
    assignments: 'turan_assignments',
    users: 'turan_users',
    subscriptions: 'turan_subscriptions',
    visits: 'turan_visits',
    audit: 'turan_audit'
};

function load(key) {
    try {
        const raw = localStorage.getItem(STORE_KEYS[key]);
        return raw ? JSON.parse(raw) : null;
    } catch { return null; }
}
function save(key, data) {
    localStorage.setItem(STORE_KEYS[key], JSON.stringify(data));
    if (useFirestore && db) {
        db.collection('gym_data').doc(key).set({ data, updatedAt: firebase.firestore.FieldValue.serverTimestamp() })
            .catch(e => console.warn('Firestore save failed', e));
    }
}

let inventory = load('inventory') || [
    { id: 1, name: 'Протеин Whey 1kg', price: 18000, stock: 12 },
    { id: 2, name: 'BCAA 300g', price: 9500, stock: 4 },
    { id: 3, name: 'Вода 0.5l', price: 300, stock: 45 },
    { id: 4, name: 'Энергетический батончик', price: 800, stock: 2 },
    { id: 5, name: 'Креатин 300g', price: 6500, stock: 8 },
    { id: 6, name: 'Гейнер 2kg', price: 14500, stock: 6 },
    { id: 7, name: 'Изотоник 500ml', price: 450, stock: 30 },
    { id: 8, name: 'Полотенце', price: 2500, stock: 15 }
];

let clients = load('clients') || [
    { id: 1, name: 'Алексей Смирнов', phone: '+7 701 111 2233', payDate: '2026-09-29', lastVisit: '2026-09-20', qrCode: 'GYM-1-ALEX' },
    { id: 2, name: 'Елена Иванова', phone: '+7 707 333 4455', payDate: '2026-10-05', lastVisit: '2026-09-27', qrCode: 'GYM-2-ELENA' },
    { id: 3, name: 'Дмитрий Петров', phone: '+7 705 777 8899', payDate: '2026-09-25', lastVisit: '2026-09-10', qrCode: 'GYM-3-DMIT' },
    { id: 4, name: 'Мария Козлова', phone: '+7 702 555 6677', payDate: '2026-10-12', lastVisit: '2026-09-15', qrCode: 'GYM-4-MARI' },
    { id: 5, name: 'Игорь Волков', phone: '+7 708 999 0011', payDate: '2026-09-20', lastVisit: '2026-09-05', qrCode: 'GYM-5-IGOR' },
    { id: 6, name: 'Анна Соколова', phone: '+7 701 222 3344', payDate: '2026-10-01', lastVisit: '2026-09-26', qrCode: 'GYM-6-ANNA' },
    { id: 7, name: 'Сергей Морозов', phone: '+7 705 444 5566', payDate: '2026-09-18', lastVisit: '2026-08-28', qrCode: 'GYM-7-SERG' },
    { id: 8, name: 'Ольга Лебедева', phone: '+7 707 666 7788', payDate: '2026-10-08', lastVisit: '2026-09-22', qrCode: 'GYM-8-OLGA' },
    { id: 9, name: 'Павел Новиков', phone: '+7 702 888 9900', payDate: '2026-09-30', lastVisit: '2026-09-12', qrCode: 'GYM-9-PAVL' },
    { id: 10, name: 'Наталья Федорова', phone: '+7 708 111 2233', payDate: '2026-10-15', lastVisit: '2026-09-25', qrCode: 'GYM-10-NATA' }
];
clients.forEach(c => {
    if (!c.qrCode) c.qrCode = 'GYM-' + c.id + '-' + (c.name.split(' ')[0] || 'USER').toUpperCase().slice(0, 4);
});
save('clients', clients);

function generateDemoActivity() {
    const log = [];
    const today = new Date();
    for (let i = 0; i < 45; i++) {
        const d = new Date(today);
        d.setDate(d.getDate() - i);
        const sales = Math.floor(Math.random() * 12) + 1;
        log.push({
            date: d.toISOString().slice(0, 10),
            visits: Math.floor(Math.random() * 28) + 8,
            sales,
            revenue: sales * (Math.floor(Math.random() * 8000) + 500)
        });
    }
    return log;
}
let activityLog = load('activity') || generateDemoActivity();
let memberMetrics = load('metrics') || {
    dates: ['01.09', '10.09', '20.09', '28.09'],
    weights: [82, 80.5, 79.2, 78.5],
    biceps: [36.5, 37.0, 38.0, 38.5]
};
let loyaltyMap = load('loyalty') || {};
let clientProfiles = load('profiles') || {};
let trainers = load('trainers') || [];
let trainerCategories = load('trainerCategories') || [];
let assignments = load('assignments') || [];
let appUsers = load('users') || {};

async function loadFromFirestore() {
    if (!useFirestore || !db) return;
    try {
        for (const key of Object.keys(STORE_KEYS)) {
            const snap = await db.collection('gym_data').doc(key).get();
            if (snap.exists && snap.data().data) {
                const d = snap.data().data;
                if (key === 'inventory') inventory = d;
                if (key === 'clients') clients = d;
                if (key === 'activity') activityLog = d;
                if (key === 'metrics') memberMetrics = d;
                if (key === 'loyalty') loyaltyMap = d;
                if (key === 'profiles') clientProfiles = d;
                if (key === 'trainers') trainers = d;
                if (key === 'trainerCategories') trainerCategories = d;
                if (key === 'assignments') assignments = d;
                if (key === 'users') appUsers = d;
                if (key === 'subscriptions') subscriptions = d;
                if (key === 'visits') visits = d;
                if (key === 'audit') auditLog = d;
                localStorage.setItem(STORE_KEYS[key], JSON.stringify(d));
            }
        }
    } catch (e) { console.warn('Firestore load failed', e); }
}

function roleLabel(role) {
    if (role === 'member') return 'Клиент';
    if (role === 'admin') return 'Админ';
    if (role === 'reception') return 'Ресепшен';
    return role;
}

function isClientProfileComplete(clientId) {
    const p = clientProfiles[String(clientId)] || {};
    const c = getClientById(clientId) || {};
    return !!((p.gender || c.gender) && (p.weight || c.weight) && (p.goal || c.goal) && c.phone);

async function ensureGoogleClient(user) {
    if (!user || !db) return null;
    const email = (user.email || '').toLowerCase();
    let c = clients.find(x =>
        x.uid === user.uid ||
        (x.email || '').toLowerCase() === email
    );

    if (!c) {
        const id = 'c_' + user.uid;
        c = {
            id,
            uid: user.uid,
            name: user.displayName || email,
            email,
            phone: '',
            birthDate: '',
            gender: '',
            weight: '',
            goal: '',
            note: '',
            payDate: '',
            lastVisit: '',
            qrCode: 'TURAN-' + id
        };
        clients.push(c);
        save('clients', clients);
        await fsSet('clients', String(id), c);
    } else {
        let changed = false;
        if (!c.uid) { c.uid = user.uid; changed = true; }
        if (!c.email) { c.email = email; changed = true; }
        if (!c.name) { c.name = user.displayName || email; changed = true; }
        if (!c.qrCode) { c.qrCode = 'TURAN-' + c.id; changed = true; }
        if (changed) {
            save('clients', clients);
            await fsSet('clients', String(c.id), c);
        }
    }
    return c;
}

async function getUserRole(user, userDoc) {
    const email = (user.email || '').toLowerCase();
    let role = 'member';

    // Назначение админа по конфигурации имеет самый высокий приоритет.
    if (TURAN_CONFIG.adminEmails.map(x => String(x).toLowerCase()).includes(email)) {
        return 'admin';
    }

    // Сначала читаем назначение по email. Это позволяет админу менять роль
    // уже зарегистрированного пользователя без повторного входа.
    try {
        const eDoc = await db.collection('usersByEmail').doc(email).get();
        if (eDoc.exists && eDoc.data().role) role = eDoc.data().role;
    } catch (_) {}

    if (!role && userDoc && userDoc.role) role = userDoc.role;
    // Для старых пользователей, у которых usersByEmail ещё не было.
    if (role === 'member' && userDoc && userDoc.role) {
        role = userDoc.role;
    }
    return role;
}

async function syncGoogleUser(user, openApp = true) {
    if (!user || !db) return;

    await loadFromFirestore();
    await loadTuranCollections();

    const email = (user.email || '').toLowerCase();
    let userDoc = {};
    try {
        const uDoc = await db.collection('users').doc(user.uid).get();
        if (uDoc.exists) userDoc = uDoc.data() || {};
    } catch (_) {}

    const role = await getUserRole(user, userDoc);
    const client = await ensureGoogleClient(user);
    const clientId = client ? client.id : (userDoc.clientId || null);

    const userData = {
        uid: user.uid,
        email,
        displayName: user.displayName || '',
        photoURL: user.photoURL || '',
        role,
        clientId: clientId || null,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    await db.collection('users').doc(user.uid).set(userData, { merge: true });

    appUsers[email] = {
        email, role, uid: user.uid,
        name: user.displayName || email,
        clientId: clientId || null
    };
    saveTuran('users', appUsers);

    if (openApp) {
        setUserSession({
            name: user.displayName || email,
            email, uid: user.uid, role,
            clientId
        });
    }

    return { role, clientId, client };
}

async function loginWithGoogle() {
    if (!auth) {
        const status = document.getElementById('auth-status');
        if (status) status.textContent = 'Firebase не настроен. Откройте firebase-config.js и вставьте данные вашего проекта.';
        return;
    }
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({ prompt: 'select_account' });

    try {
        await auth.signInWithPopup(provider);
        // onAuthStateChanged продолжит авторизацию и создаст/обновит карточку клиента.
    } catch (e) {
        const status = document.getElementById('auth-status');
        if (status) status.textContent = 'Ошибка входа: ' + e.message;
    }
}

function esc(v) {
    return String(v ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function saveTuran(key, data) {
    save(key, data);
}
async function fsSet(collection, id, data) {
    if (!useFirestore || !db) return;
    try { await db.collection(collection).doc(String(id)).set(data, {merge:true}); } catch(e) { console.warn(collection, e); }
}
async function fsDelete(collection, id) {
    if (!useFirestore || !db) return;
    try { await db.collection(collection).doc(String(id)).delete(); } catch(e) { console.warn(collection, e); }
}
async function loadTuranCollections() {
    if (!useFirestore || !db) return;
    const isMember = currentUser && currentUser.role === 'member';
    try {
        const clientRef = db.collection('clients');
        const clientSnap = isMember && auth.currentUser
            ? await clientRef.where('uid', '==', auth.currentUser.uid).get()
            : await clientRef.get();
        if (!clientSnap.empty) {
            const remoteClients = clientSnap.docs.map(d => ({id:d.id, ...d.data()}));
            const byId = new Map(clients.map(c => [String(c.id), c]));
            remoteClients.forEach(c => byId.set(String(c.id), c));
            clients = Array.from(byId.values());
            localStorage.setItem(STORE_KEYS.clients, JSON.stringify(clients));
        }
    } catch(e) {
        // У клиента может быть доступ только к собственной карточке — это нормально.
        console.warn('Load clients collection', e);
    }

    const collections = [
        ['trainers', 'trainers'],
        ['trainerCategories', 'trainerCategories']
    ];
    if (isMember && auth.currentUser) {
        collections.push(['assignments', 'assignments']);
    } else {
        collections.push(['assignments', 'assignments']);
    }

    for (const [collection, key] of collections) {
        try {
            let snap;
            if (collection === 'assignments' && isMember && auth.currentUser) {
                snap = await db.collection('assignments')
                    .where('clientUid', '==', auth.currentUser.uid)
                    .get();
            } else {
                snap = await db.collection(collection).get();
            }
            const arr = snap.docs.map(d => ({id:d.id, ...d.data()}));
            if (key === 'trainers') trainers = arr;
            if (key === 'trainerCategories') trainerCategories = arr;
            if (key === 'assignments') assignments = arr;
            localStorage.setItem(STORE_KEYS[key], JSON.stringify(arr));
        } catch(e) { console.warn('Load '+collection, e); }
    }
}

function createAssignment() {
    const ids = [...(document.getElementById('as-client')?.selectedOptions || [])].map(o=>o.value);
    const title = document.getElementById('as-title')?.value.trim();
    if (!ids.length || !title) { alert('Выберите хотя бы одного клиента и укажите название задания.'); return; }
    const base = {
      trainerId: document.getElementById('as-trainer')?.value || '',
      title, speed: parseFloat(document.getElementById('as-speed')?.value) || null,
      duration: parseInt(document.getElementById('as-duration')?.value,10) || null,
      distance: parseFloat(document.getElementById('as-distance')?.value) || null,
      reps: document.getElementById('as-reps')?.value.trim() || '',
      dueDate: document.getElementById('as-date')?.value || new Date().toISOString().slice(0,10),
      note: document.getElementById('as-note')?.value.trim() || '',
      status:'assigned', createdAt:new Date().toISOString(), createdBy:currentUser.uid || ''
    };
    ids.forEach(cid => {
      const id = 'a_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
      const cc=getClientById(cid); const item = {id, clientId:cid, clientUid:cc?.uid||'', ...base};
      assignments.unshift(item); fsSet('assignments', id, item);
    });
    saveTuran('assignments', assignments);
    alert(`Задание назначено: ${ids.length} клиент(ам).`);
    showPage('assignments');
}

    return `<div class="page-title">Доступ и роли</div><div class="page-desc">Роль определяется по Google-аккаунту. Админ может назначить client, reception или admin.</div>
    <div class="card" style="max-width:650px"><div class="form-group"><label>Email Google-аккаунта</label><input id="access-email" type="email" class="form-control" placeholder="user@gmail.com"></div>
    <div class="form-group"><label>Роль</label><select id="access-role" class="form-control"><option value="member">Клиент</option><option value="reception">Ресепшен</option><option value="admin">Админ</option></select></div>
    <button class="btn btn-primary btn-block" onclick="setAccessRole()">Сохранить доступ</button></div>
    <div class="card"><div id="access-users-list"></div></div>`;
}
async function setAccessRole() {
    const email = document.getElementById('access-email')?.value.trim().toLowerCase();
    const role = document.getElementById('access-role')?.value;
    if (!email) return alert('Введите email');

    const item = {
        email, role,
        updatedAt: new Date().toISOString(),
        updatedBy: currentUser.uid || ''
    };

    try {
        // Главный источник назначения роли — usersByEmail.
        if (useFirestore && db) {
            await db.collection('usersByEmail').doc(email).set(item, { merge: true });

            // Если пользователь уже входил, сразу обновляем его users/{uid}.
            const snap = await db.collection('users')
                .where('email', '==', email)
                .limit(1)
                .get();

            if (!snap.empty) {
                const target = snap.docs[0];
                const targetData = target.data() || {};
                await target.ref.set({
                    role,
                    email,
                    uid: target.id,
                    clientId: targetData.clientId || null,
                    roleUpdatedAt: firebase.firestore.FieldValue.serverTimestamp(),
                    roleUpdatedBy: currentUser.uid || ''
                }, { merge: true });

                item.uid = target.id;
                item.clientId = targetData.clientId || null;
            }
        }

        appUsers[email] = item;
        saveTuran('users', appUsers);

        logAction('Изменение роли', `${email} → ${roleLabel(role)}`);
        alert('Доступ сохранён. Если пользователь уже вошёл, его роль обновится автоматически.');
        renderAccessUsers();
    } catch (e) {
        alert('Ошибка сохранения: ' + e.message);
    }
}


function renderAccessUsers() {
    const el=document.getElementById('access-users-list'); if(!el)return;
    const vals=Object.values(appUsers);
    el.innerHTML=vals.length?vals.map(u=>`<div style="padding:12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px"><span>${esc(u.email)}</span><b>${roleLabel(u.role)}</b></div>`).join(''):'<div style="color:var(--text-muted)">Пользователи ещё не назначены.</div>';
}

async function adminEditClient(id) {
    const c = getClientById(id);
    if (!c) return;
    const name = prompt('ФИО клиента:', c.name || '');
    if (name === null) return;
    const phone = prompt('Телефон:', c.phone || '');
    if (phone === null) return;
    const birthDate = prompt('Дата рождения YYYY-MM-DD:', c.birthDate || '');
    if (birthDate === null) return;
    const payDate = prompt('Дата оплаты YYYY-MM-DD:', c.payDate || '');
    if (payDate === null) return;
    c.name = name.trim();
    c.phone = phone.trim();
    c.birthDate = birthDate.trim();
    c.payDate = payDate.trim();
    c.profileUpdatedAt = new Date().toISOString();
    save('clients', clients);
    if (useFirestore) await fsSet('clients', String(c.id), c);
    logAction('Изменение клиента', c.name);
    renderClientsTable();
}

async function adminDeleteClient(id) {
    const c=getClientById(id); if(!c)return;
    if(!confirm(`Удалить клиента «${c.name}»? Его задания тоже будут удалены.`))return;
    const deletedAssignments=assignments.filter(a=>String(a.clientId)===String(id));
    clients=clients.filter(x=>String(x.id)!==String(id));
    assignments=assignments.filter(a=>String(a.clientId)!==String(id));
    save('clients',clients); saveTuran('assignments',assignments);
    if(useFirestore){ await fsDelete('clients',id); for(const a of deletedAssignments) await fsDelete('assignments',a.id); }
    logAction('Удаление клиента', c.name);
    renderClientsTable();
}

async function saveClientOnboarding() {
    const name = (document.getElementById('ob-name')?.value || '').trim();
    const phone = (document.getElementById('ob-phone')?.value || '').trim();
    const birthDate = document.getElementById('ob-birthDate')?.value || '';
    const gender = document.getElementById('ob-gender')?.value;
    const weight = parseFloat(document.getElementById('ob-weight')?.value);
    const goal = document.getElementById('ob-goal')?.value;
    const note = (document.getElementById('ob-note')?.value || '').trim();

    if (!name || !gender || !phone || isNaN(weight) || weight < 30 || !goal) {
        alert('Заполните ФИО, телефон, пол, вес и цель.');
        return;
    }

    const cid = String(currentUser.clientId);
    const c = getClientById(cid);
    if (!c) return alert('Карточка клиента не найдена.');

    c.name = name;
    c.phone = phone;
    c.birthDate = birthDate;
    c.gender = gender;
    c.weight = weight;
    c.goal = goal;
    c.note = note;
    c.profileCompleted = true;
    c.profileUpdatedAt = new Date().toISOString();

    clientProfiles[cid] = {
        ...(clientProfiles[cid] || {}),
        name, phone, birthDate, gender, weight, goal, note,
        updatedAt: new Date().toISOString()
    };

    save('clients', clients);
    save('profiles', clientProfiles);
    if (useFirestore) {
        await fsSet('clients', cid, c);
        // profiles остаётся в gym_data и синхронизируется через save().
    }

    currentUser.clientName = name;
    document.getElementById('user-name-display').textContent = name;

    if (memberMetrics.weights.length) {
        memberMetrics.weights[memberMetrics.weights.length - 1] = weight;
        save('metrics', memberMetrics);
    }

    alert('Данные сохранены. Администратор увидит их в карточке клиента.');
    showPage('subscription');
}

function processQrScan() {
    const code = (document.getElementById('qr-input')?.value || '').trim().toUpperCase();
    const resultEl = document.getElementById('qr-result');
    if (!code) {
        if (resultEl) resultEl.innerHTML = '<span class="tag tag-danger">Введите код</span>';
        return;
    }
    const client = clients.find(c => (c.qrCode || '').toUpperCase() === code);
    if (!client) {
        if (resultEl) resultEl.innerHTML = '<span class="tag tag-danger">Клиент не найден</span>';
        return;
    }
    const today = new Date().toISOString().slice(0, 10);
    client.lastVisit = today;
    save('clients', clients);
    let entry = activityLog.find(a => a.date === today);
    if (!entry) {
        entry = { date: today, visits: 0, sales: 0, revenue: 0 };
        activityLog.unshift(entry);
    }
    entry.visits += 1;
    save('activity', activityLog);
    const cid = String(client.id);
    let filled = loyaltyMap[cid] || 0;
    if (filled < 15) filled += 1;
    loyaltyMap[cid] = filled;
    save('loyalty', loyaltyMap);
    if (resultEl) {
        resultEl.innerHTML = `
            <span class="tag tag-ok">Посещение засчитано</span>
            <div style="margin-top:8px;"><b>${client.name}</b></div>
            <div style="color:var(--text-muted);font-size:0.9rem;">Карточек: ${filled} / 15</div>`;
    }
    document.getElementById('qr-input').value = '';
}

function renderPagination(containerId, total, current, onPage) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
    el.innerHTML = '';
    if (total === 0) return;
    const info = document.createElement('span');
    info.className = 'page-info';
    info.textContent = `${(current-1)*PAGE_SIZE+1}–${Math.min(current*PAGE_SIZE, total)} из ${total}`;
    el.appendChild(info);
    const prev = document.createElement('button');
    prev.className = 'page-btn'; prev.textContent = '‹'; prev.disabled = current <= 1;
    prev.onclick = () => onPage(current - 1);
    el.appendChild(prev);
    let start = Math.max(1, current - 2);
    let end = Math.min(totalPages, start + 4);
    if (end - start < 4) start = Math.max(1, end - 4);
    for (let i = start; i <= end; i++) {
        const b = document.createElement('button');
        b.className = 'page-btn' + (i === current ? ' active' : '');
        b.textContent = i;
        b.onclick = () => onPage(i);
        el.appendChild(b);
    }
    const next = document.createElement('button');
    next.className = 'page-btn'; next.textContent = '›'; next.disabled = current >= totalPages;
    next.onclick = () => onPage(current + 1);
    el.appendChild(next);
}

function sellProductReception() {
    const pId = parseInt(document.getElementById('rec-product-select').value, 10);
    const qty = parseInt(document.getElementById('rec-product-qty').value, 10) || 1;
    const prod = inventory.find(p => p.id === pId);
    if (prod && prod.stock >= qty) {
        prod.stock -= qty;
        save('inventory', inventory);
        const today = new Date().toISOString().slice(0, 10);
        let entry = activityLog.find(a => a.date === today);
        if (!entry) { entry = { date: today, visits: 0, sales: 0, revenue: 0 }; activityLog.unshift(entry); }
        entry.sales += qty;
        entry.revenue += prod.price * qty;
        save('activity', activityLog);
        alert('Продано: ' + (prod.price * qty).toLocaleString('ru-RU') + ' ₸');
        fillSellSelect();
    } else alert('Недостаточно товара');
}

function updateAdminReports() {

    const group = document.getElementById('report-group')?.value || 'weekday';
    const fromWrap = document.getElementById('custom-from-wrap');
    const toWrap = document.getElementById('custom-to-wrap');
    if (fromWrap) fromWrap.style.display = period === 'custom' ? 'block' : 'none';
    if (toWrap) toWrap.style.display = period === 'custom' ? 'block' : 'none';
    const ref = new Date();
    let from, to;
    if (period === 'week') {
        from = new Date(ref); from.setDate(from.getDate() - from.getDay() + 1);
        to = new Date(from); to.setDate(to.getDate() + 6);
    } else if (period === 'month') {
        from = new Date(ref.getFullYear(), ref.getMonth(), 1);
        to = new Date(ref.getFullYear(), ref.getMonth() + 1, 0);
    } else {
        const f = document.getElementById('report-from')?.value;
        const t = document.getElementById('report-to')?.value;
        from = f ? new Date(f) : new Date(ref.getFullYear(), ref.getMonth(), 1);
        to = t ? new Date(t) : ref;
    }
    const fromStr = from.toISOString().slice(0, 10);
    const toStr = to.toISOString().slice(0, 10);
    const filtered = activityLog.filter(a => a.date >= fromStr && a.date <= toStr);
    const totalVisits = filtered.reduce((s, a) => s + a.visits, 0);
    const totalSales = filtered.reduce((s, a) => s + a.sales, 0);
    const totalRevenue = filtered.reduce((s, a) => s + a.revenue, 0);
    const overdue = clients.filter(c => new Date(c.payDate) < ref).length;
    const absent = clients.filter(c => Math.floor((ref - new Date(c.lastVisit)) / 86400000) > 7).length;
    const statsEl = document.getElementById('admin-stats');
    if (statsEl) {
        statsEl.innerHTML = `
            <div class="stat-card"><div class="stat-value">${totalVisits}</div><div class="stat-label">Посещений</div></div>
            <div class="stat-card"><div class="stat-value">${totalSales}</div><div class="stat-label">Продаж</div></div>
            <div class="stat-card"><div class="stat-value">${(totalRevenue/1000).toFixed(0)}k</div><div class="stat-label">Выручка</div></div>
            <div class="stat-card"><div class="stat-value">${overdue}</div><div class="stat-label">Просрочек</div></div>
            <div class="stat-card"><div class="stat-value">${absent}</div><div class="stat-label">Пропускающих</div></div>
            <div class="stat-card"><div class="stat-value">${inventory.reduce((s,i)=>s+i.stock,0)}</div><div class="stat-label">На складе</div></div>`;
    }
    const weekdays = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
    let labels = [], visitData = [], revenueData = [];
    if (group === 'weekday') {
        const buckets = Array(7).fill(0).map(() => ({ visits: 0, revenue: 0 }));
        filtered.forEach(a => {
            const wd = new Date(a.date).getDay();
            buckets[wd].visits += a.visits;
            buckets[wd].revenue += a.revenue;
        });
        const order = [1,2,3,4,5,6,0];
        labels = order.map(i => weekdays[i]);
        visitData = order.map(i => buckets[i].visits);
        revenueData = order.map(i => buckets[i].revenue);
    } else if (group === 'day') {
        const sorted = [...filtered].sort((a,b) => a.date.localeCompare(b.date));
        labels = sorted.map(a => a.date.slice(5));
        visitData = sorted.map(a => a.visits);
        revenueData = sorted.map(a => a.revenue);
    } else {
        const map = {};
        filtered.forEach(a => {
            const m = a.date.slice(0, 7);
            if (!map[m]) map[m] = { visits: 0, revenue: 0 };
            map[m].visits += a.visits;
            map[m].revenue += a.revenue;
        });
        const keys = Object.keys(map).sort();
        labels = keys;
        visitData = keys.map(k => map[k].visits);
        revenueData = keys.map(k => map[k].revenue);
    }
    const textColor = getComputedStyle(document.body).getPropertyValue('--text').trim() || '#fafaf9';
    const primary = '#f97316';
    const vCanvas = document.getElementById('adminVisitsChart');
    if (vCanvas) {
        if (visitsChart) visitsChart.destroy();
        visitsChart = new Chart(vCanvas.getContext('2d'), {
            type: 'bar',
            data: { labels, datasets: [{ label: 'Посещения', data: visitData, backgroundColor: primary, borderRadius: 6 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } },
                scales: { x: { ticks: { color: textColor }, grid: { display: false } }, y: { ticks: { color: textColor }, grid: { color: 'rgba(128,128,128,0.12)' } } } }
        });
    }
    const rCanvas = document.getElementById('adminRevenueChart');
    if (rCanvas) {
        if (revenueChart) revenueChart.destroy();
        revenueChart = new Chart(rCanvas.getContext('2d'), {
            type: 'line',
            data: { labels, datasets: [{ label: 'Выручка (₸)', data: revenueData, borderColor: primary, backgroundColor: 'rgba(249,115,22,0.12)', tension: 0.35, fill: true }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { labels: { color: textColor } } },
                scales: { x: { ticks: { color: textColor }, grid: { color: 'rgba(128,128,128,0.12)' } }, y: { ticks: { color: textColor }, grid: { color: 'rgba(128,128,128,0.12)' } } } }
        });
    }
}

function importExcel() {
    const file = document.getElementById('excel-file-input')?.files[0];
    if (!file) { alert('Выберите файл Excel (.xlsx)'); return; }
    const reader = new FileReader();
    reader.onload = e => {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
            let added = 0;
            for (let i = 1; i < rows.length; i++) {
                const cols = rows[i];
                if (!cols || !cols[0]) continue;
                const name = String(cols[0]).trim();
                const phone = cols[1] ? String(cols[1]).trim() : '';
                let payDate = cols[2] ? String(cols[2]).trim() : new Date().toISOString().slice(0, 10);
                if (/^\d+(\.\d+)?$/.test(payDate)) {
                    const d = XLSX.SSF.parse_date_code(parseFloat(payDate));
                    if (d) payDate = d.y + '-' + String(d.m).padStart(2,'0') + '-' + String(d.d).padStart(2,'0');
                }
                const id = Date.now() + i;
                const qrCode = 'GYM-' + id + '-' + name.split(' ')[0].toUpperCase().slice(0, 4);
                clients.push({ id, name, phone, payDate, lastVisit: new Date().toISOString().slice(0, 10), qrCode });
                added++;
            }
            save('clients', clients);
            alert('Импортировано из Excel: ' + added);
        } catch (err) {
            alert('Ошибка чтения Excel: ' + err.message);
        }
    };
    reader.readAsArrayBuffer(file);
}

if (auth) {
    auth.onAuthStateChanged(async user => {
        if (roleUnsubscribe) {
            try { roleUnsubscribe(); } catch (_) {}
            roleUnsubscribe = null;
        }

        if (!user) {
            currentUser = null;
            document.getElementById('auth-screen').style.display = 'flex';
            document.getElementById('app-shell').style.display = 'none';
            return;
        }

        try {
            await syncGoogleUser(user, true);
            await loadProData();

            // Живое обновление роли. Администратор меняет роль —
            // текущий пользователь сразу получает новый интерфейс.
            roleUnsubscribe = db.collection('users').doc(user.uid).onSnapshot(async snap => {
                if (!snap.exists || !currentUser || currentUser.uid !== user.uid) return;

                const data = snap.data() || {};
                const email = (user.email || '').toLowerCase();
                let newRole = data.role || 'member';

                if (!TURAN_CONFIG.adminEmails.map(x => String(x).toLowerCase()).includes(email)) {
                    try {
                        const eDoc = await db.collection('usersByEmail').doc(email).get();
                        if (eDoc.exists && eDoc.data().role) newRole = eDoc.data().role;
                    } catch (_) {}
                } else {
                    newRole = 'admin';
                }

                const oldRole = currentUser.role;
                if (oldRole === newRole && String(currentUser.clientId || '') === String(data.clientId || '')) return;

                const client = await ensureGoogleClient(user);
                currentUser.role = newRole;
                currentUser.clientId = data.clientId || (client && client.id) || currentUser.clientId || null;

                document.getElementById('user-role-display').textContent = roleLabel(newRole);
                buildSidebar();

                if (newRole === 'member' && currentUser.clientId && !isClientProfileComplete(currentUser.clientId)) {
                    showPage('onboarding');
                } else if (NAV[newRole]) {
                    showPage(NAV[newRole][0].items[0].id);
                }

                // Если пользователь стал админом/ресепшеном, подтягиваем общие данные.
                if (newRole === 'admin' || newRole === 'reception') {
                    await loadFromFirestore();
                    await loadTuranCollections();
                }
            });
        } catch (e) {
            console.warn('Session restore', e);
        }
    });
}

function todayISO(){ return new Date().toISOString().slice(0,10); }
function uid(prefix){ return prefix + '_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }
function getSubscription(cid){
    return subscriptions.find(x => String(x.clientId) === String(cid) && x.status !== 'cancelled') || null;
}
function subscriptionStatus(s){
    if(!s) return ['Нет абонемента','tag-danger'];
    const now=new Date(); const end=new Date(s.endDate+'T23:59:59');
    const days=Math.ceil((end-now)/86400000);
    if(days<0) return ['Истёк','tag-danger'];
    if(days<=7) return ['Заканчивается','tag-warn'];
    return ['Активен','tag-ok'];
}

// Загружаем новые коллекции из Firestore при восстановлении сессии.
async function loadProData(){
 if(!useFirestore||!db)return;
 for(const key of ['subscriptions','visits','audit']){try{const snap=await db.collection('gym_data').doc(key).get();if(snap.exists&&snap.data().data){if(key==='subscriptions')subscriptions=snap.data().data;if(key==='visits')visits=snap.data().data;if(key==='audit')auditLog=snap.data().data;localStorage.setItem(STORE_KEYS[key],JSON.stringify(snap.data().data));}}catch(e){console.warn('Load '+key,e);}}
}
